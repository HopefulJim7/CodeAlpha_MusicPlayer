<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse | Music Player</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="player">
    <div class="cover" aria-hidden="true"><span id="coverLetter">P</span></div>

    <h1 id="trackTitle">Track title</h1>
    <p id="trackArtist">Artist</p>

    <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek">
    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>

    <div class="controls">
      <button id="prevBtn" aria-label="Previous track">&#9198;</button>
      <button id="playBtn" class="play" aria-label="Play">&#9654;</button>
      <button id="nextBtn" aria-label="Next track">&#9197;</button>
    </div>

    <div class="volume-row">
      <label for="volume">Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>

    <ul id="playlist" class="playlist"></ul>
    <audio id="audio" preload="metadata"></audio>
  </main>

  <p class="credit">CodeAlpha Frontend Internship &middot; Task 4 &middot; Built by Jim Hope</p>
  <script src="js/player.js"></script>
</body>
</html>
